name: Build and Release with Conda

on:
  push:
    branches:
      - 'release/v1.10.1'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., v1.0.0)'
        required: false
        type: string
      include_chickenrice:
        description: 'Deprecated and ignored; all model variants are included'
        required: false
        type: boolean
        default: false

jobs:
  build-windows:
    name: Build Windows
    uses: ./.github/workflows/build-windows.yml

  create-release:
    name: Create GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release/v1.10.1' || inputs.release_version != ''
    permissions:
      contents: write

    steps:
    - name: Checkout code for release notes
      uses: actions/checkout@v4

    - name: Prepare release body
      id: read_body
      shell: bash
      run: |
        echo 'body<<EOF' >> "$GITHUB_OUTPUT"
        echo 'Faster-Whisper-TransWithAI-ChickenRice v1.10.1' >> "$GITHUB_OUTPUT"
        echo '' >> "$GITHUB_OUTPUT"
        echo '- 修复多句话被塞进一条字幕的问题。' >> "$GITHUB_OUTPUT"
        echo '- 使用词级时间戳按停顿、标点和目标时长拆分字幕。' >> "$GITHUB_OUTPUT"
        echo '- 修复极短字幕、单字尾巴和错误断词。' >> "$GITHUB_OUTPUT"
        echo '- 默认配置已切换为本次 30 分钟样本验证通过的配置。' >> "$GITHUB_OUTPUT"
        echo 'EOF' >> "$GITHUB_OUTPUT"

    - name: Create empty placeholder file for initial release
      run: |
        echo "Binary files are being uploaded by this workflow." > placeholder.txt

    - name: Create Release with placeholder
      uses: ading2210/gh-large-releases@v1
      with:
        repository: ${{ github.repository }}
        tag_name: v1.10.1
        name: v1.10.1
        body: ${{ steps.read_body.outputs.body }}
        draft: false
        prerelease: false
        files: placeholder.txt
        token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: Upload ${{ matrix.build.label }} ${{ matrix.model.label }}
    needs: [create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release/v1.10.1' || inputs.release_version != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        build:
          - suffix: cu118
            label: CUDA 11.8
          - suffix: cu122
            label: CUDA 12.2
          - suffix: cu128
            label: CUDA 12.8
          - suffix: gfx101x_dgpu
            label: AMD gfx101X
          - suffix: gfx103x_dgpu
            label: AMD gfx103X
          - suffix: gfx110x_all
            label: AMD gfx110X
          - suffix: gfx120x_all
            label: AMD gfx120X
        model:
          - suffix: nomodel
            label: No Model
          - suffix: translate
            label: Translate
          - suffix: transcribe
            label: Transcribe

    steps:
    - name: Download artifact
      uses: actions/download-artifact@v6
      with:
        name: faster_whisper_transwithai_windows_${{ matrix.build.suffix }}-${{ matrix.model.suffix }}
        path: artifact/

    - name: Create archive with optimized compression
      run: |
        archive_name="faster_whisper_transwithai_windows_${{ matrix.build.suffix }}-${{ matrix.model.suffix }}.zip"
        cd artifact
        zip -5 -r -q "../$archive_name" .
        cd ..

    - name: Upload to release with large file support
      uses: ading2210/gh-large-releases@v1
      with:
        repository: ${{ github.repository }}
        tag_name: v1.10.1
        files: faster_whisper_transwithai_windows_${{ matrix.build.suffix }}-${{ matrix.model.suffix }}.zip
        token: ${{ secrets.GITHUB_TOKEN }}
