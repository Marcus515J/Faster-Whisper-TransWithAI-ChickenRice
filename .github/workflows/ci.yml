name: CI

# Routine CI stays fast and deterministic: lint/type-check Python and parse
# PowerShell scripts on Windows. The expensive full Windows build matrix is kept
# for explicit manual verification and release workflows.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install lint tools
      run: |
        python -m pip install --upgrade pip
        pip install "ruff==0.15.2" "mypy==1.18.2" "types-requests"

    - name: Ruff lint
      run: ruff check .

    - name: Ruff format diagnostic
      run: ruff format --diff . || true

    - name: Mypy type-check
      run: mypy --config-file pyproject.toml src infer.py download_models.py modal_infer.py build_windows.py runtime_hook.py

  powershell-parse:
    name: PowerShell 5.1 parse check
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Parse PowerShell scripts
      shell: powershell
      run: |
        $failed = $false
        Get-ChildItem -Path . -Recurse -File -Filter *.ps1 | ForEach-Object {
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $_.FullName,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $failed = $true
            Write-Host "Parse errors in $($_.FullName):" -ForegroundColor Red
            $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
          }
        }
        if ($failed) { exit 1 }
        Write-Host "All PowerShell scripts parsed successfully."

  # Full packaging is intentionally manual here. Releases still run the complete
  # CUDA/ROCm + model matrix through build-release-conda.yml.
  build-windows:
    if: github.event_name == 'workflow_dispatch'
    name: Build and check all Windows variants
    uses: ./.github/workflows/build-windows.yml
    with:
      upload_artifacts: false
