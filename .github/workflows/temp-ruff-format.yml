name: Temporary Ruff Format

on:
  push:
    branches:
      - chore/fix-ruff-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/fix-ruff-format
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Ruff
        run: pip install "ruff==0.15.2"
      - name: Format target file
        run: ruff format src/faster_whisper_transwithai_chickenrice/word_timing_split.py
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/faster_whisper_transwithai_chickenrice/word_timing_split.py
          git commit -m "style: apply Ruff formatter"
          git push origin HEAD:chore/fix-ruff-format
